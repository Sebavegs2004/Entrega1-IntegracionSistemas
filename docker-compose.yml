name: vidaanimal

# ============================================================
# Clínica Veterinaria VidaAnimal — levantamiento completo
#
#   docker compose up --build
# ============================================================

services:

  # ---------- Servicio interno Agenda (gRPC) ----------
  agenda:
    build:
      context: .
      dockerfile: agenda/Dockerfile
    environment:
      AGENDA_PORT: "50051"
      DB_PATH: /data/agenda.db
    volumes:
      - agenda_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import socket;s=socket.socket();s.settimeout(2);s.connect(('localhost',50051))"]
      interval: 5s
      timeout: 3s
      retries: 6

  # ---------- API REST + interfaz web (Flask) ----------
  reservas:
    build:
      context: .
      dockerfile: reservas/Dockerfile
    ports:
      - "5000:5000"
    environment:
      AGENDA_HOST: agenda
      AGENDA_PORT: "50051"
      API_KEY: ${API_KEY}
      API_KEY_LECTURA: ${API_KEY_LECTURA}
      DB_PATH: /data/reservas.db
      REDIS_HOST: redis_cache
    volumes:
      - reservas_data:/data
    depends_on:
      agenda:
        condition: service_healthy
      redis_cache:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:5000/v1/health', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 6

  # ---------- Servicio de Caché ----------
  redis_cache:
    image: redis:7-alpine

  # ---------- Pruebas de contrato ----------
  tests:
    build:
      context: .
      dockerfile: tests/Dockerfile
    environment:
      API_BASE: http://reservas:5000
      API_KEY: ${API_KEY}
      DB_PATH: /data/reservas.db
    depends_on:
      reservas:
        condition: service_healthy
      agenda:
        condition: service_healthy

  # ---------- Segundo cliente gRPC (.NET) ----------
  cliente-dotnet:
    build:
      context: .
      dockerfile: cliente-dotnet/Dockerfile
    environment:
      AGENDA_HOST: agenda
      AGENDA_PORT: "50051"
    profiles:
      - cliente
    depends_on:
      agenda:
        condition: service_healthy

volumes:
  agenda_data:
  reservas_data: