openapi: 3.0.3

info:
  title: API de Reservas - Clinica Veterinaria VidaAnimal
  version: 1.0.0
  description: |
    Contrato del servicio de reservas, escrito antes de implementarlo.
    Permite registrar duenos, consultar los bloques horarios y crear
    reservas. Antes de confirmar una reserva, el cupo se verifica contra
    el servicio interno Agenda a traves de gRPC.

    Todas las rutas exigen el header X-API-Key, salvo /v1/health.
    Existen dos roles de clave: lectura (GET) y escritura (POST/DELETE).

servers:
  - url: /
    description: Mismo host que esta documentación

security:
  - ApiKeyAuth: []

paths:
  /v1/duenos:
    post:
      summary: Crear un dueno de mascota
      operationId: crearDueno
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NuevoDueno'
      responses:
        '201':
          description: Dueno creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dueno'
        '400':
          description: Faltan campos obligatorios, email invalido o hay campos de mas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400'
        '401':
          description: Falta el header X-API-Key o la clave no coincide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401'
        '403':
          description: La API Key solo tiene permisos de lectura
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error403'
        '415':
          description: El cuerpo no se envio como application/json
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error415'
    get:
      summary: Listar duenos
      operationId: listarDuenos
      parameters:
        - name: nombre
          in: query
          required: false
          description: Filtra por nombre (busqueda parcial)
          schema:
            type: string
            example: Juan
      responses:
        '200':
          description: Lista de duenos (vacia si no hay coincidencias)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Dueno'
        '401':
          description: Falta el header X-API-Key o la clave no coincide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401'

  /v1/duenos/{id_dueno}:
    get:
      summary: Obtener un dueno por id
      operationId: obtenerDueno
      parameters:
        - name: id_dueno
          in: path
          required: true
          description: Identificador del dueno
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Dueno encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dueno'
        '401':
          description: Falta el header X-API-Key o la clave no coincide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401'
        '404':
          description: Recurso no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error404'

  /v1/bloques:
    get:
      summary: Listar bloques horarios
      description: |
        El servicio de Reservas actua de "fachada": pide los bloques
        al servicio gRPC Agenda y los devuelve como JSON.
        La respuesta se guarda en Redis 60 segundos.
      operationId: listarBloques
      responses:
        '200':
          description: Lista de bloques con sus cupos libres
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BloqueHorario'
        '401':
          description: Falta el header X-API-Key o la clave no coincide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401'
        '503':
          description: El servicio de Agenda no responde
          headers:
            Retry-After:
              description: Segundos sugeridos antes de reintentar
              schema:
                type: integer
                example: 5
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error503'
        '504':
          description: El servicio de Agenda excedio el tiempo limite
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error504'

  /v1/bloques/{id_bloque}:
    get:
      summary: Consultar un veterinario y sus cupos libres en un bloque
      operationId: obtenerBloque
      parameters:
        - name: id_bloque
          in: path
          required: true
          description: Identificador del bloque horario
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Datos del bloque horario y su veterinario
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BloqueHorario'
        '401':
          description: Falta el header X-API-Key o la clave no coincide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401'
        '404':
          description: El bloque horario no existe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error404'
        '503':
          description: El servicio de Agenda no responde
          headers:
            Retry-After:
              schema:
                type: integer
                example: 5
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error503'

  /v1/reservas:
    post:
      summary: Crear una reserva
      description: |
        Asegura la clave de idempotencia en Redis (SET NX), verifica el cupo
        en Agenda (gRPC) y guarda la cita. Si vence el timeout de Agenda,
        compensa liberando el cupo y responde 504.
      operationId: crearReserva
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: Clave unica de la peticion asociada al cuerpo enviado.
          schema:
            type: string
            example: 7f1c2a9e-0b3d
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NuevaReserva'
      responses:
        '201':
          description: Reserva creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reserva'
        '200':
          description: La reserva ya existia (se repitio la misma clave y cuerpo)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reserva'
        '400':
          description: Faltan campos obligatorios o hay campos de mas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400'
        '401':
          description: Falta el header X-API-Key o la clave no coincide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401'
        '403':
          description: La API Key solo tiene permisos de lectura
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error403'
        '404':
          description: Dueno o bloque horario no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error404'
        '409':
          description: El bloque ya no tiene cupos libres o hay una peticion identica en curso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error409'
        '415':
          description: El cuerpo no se envio como application/json
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error415'
        '422':
          description: Bloque en fecha pasada o Idempotency-Key reutilizada con otro cuerpo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error422'
        '503':
          description: El servicio de Agenda no responde
          headers:
            Retry-After:
              schema:
                type: integer
                example: 5
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error503'
        '504':
          description: Timeout hablando con Agenda (operacion compensada)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error504'
    get:
      summary: Listar reservas
      operationId: listarReservas
      parameters:
        - name: id_dueno
          in: query
          required: false
          description: Filtra por dueno
          schema:
            type: integer
            minimum: 1
        - name: estado
          in: query
          required: false
          description: Filtra por estado de la reserva
          schema:
            type: string
            enum: [activa, cancelada]
      responses:
        '200':
          description: Lista de reservas, de la mas reciente a la mas antigua
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Reserva'
        '401':
          description: Falta el header X-API-Key o la clave no coincide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401'

  /v1/reservas/{id_reserva}:
    get:
      summary: Obtener una reserva por id
      description: Incluye enlaces HATEOAS en el campo _links
      operationId: obtenerReserva
      parameters:
        - name: id_reserva
          in: path
          required: true
          description: Identificador de la reserva
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Reserva encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reserva'
        '401':
          description: Falta el header X-API-Key o la clave no coincide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401'
        '404':
          description: Recurso no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error404'
    delete:
      summary: Cancelar una reserva
      description: Cancela la reserva atomicamente y libera el cupo en Agenda
      operationId: cancelarReserva
      parameters:
        - name: id_reserva
          in: path
          required: true
          description: Identificador de la reserva
          schema:
            type: integer
            minimum: 1
      responses:
        '204':
          description: Reserva cancelada (sin cuerpo)
        '401':
          description: Falta el header X-API-Key o la clave no coincide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401'
        '403':
          description: La API Key solo tiene permisos de lectura
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error403'
        '404':
          description: Recurso no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error404'
        '409':
          description: La reserva ya estaba cancelada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error409'
        '503':
          description: El servicio de Agenda no responde
          headers:
            Retry-After:
              schema:
                type: integer
                example: 5
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error503'
        '504':
          description: Timeout hablando con Agenda (cancelacion revertida)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error504'

  /v1/health:
    get:
      summary: Comprobar que el servicio esta disponible
      description: Comprobacion de vida, no requiere API Key
      operationId: health
      security: []
      responses:
        '200':
          description: El servicio esta arriba
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Salud'

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key

  schemas:
    NuevoDueno:
      type: object
      required: [nombre, telefono]
      additionalProperties: false
      properties:
        nombre:
          type: string
          minLength: 1
          example: Juan Pérez
        telefono:
          type: string
          minLength: 1
          example: '+56912345678'
        email:
          type: string
          format: email
          nullable: true
          example: juan@mail.cl

    NuevaReserva:
      type: object
      required: [id_dueno, id_bloque, mascota_nombre]
      additionalProperties: false
      properties:
        id_dueno:
          type: integer
          minimum: 1
          example: 1
        id_bloque:
          type: integer
          minimum: 1
          description: Bloque a reservar (el id de /v1/bloques)
          example: 1
        mascota_nombre:
          type: string
          minLength: 1
          example: Rex
        motivo:
          type: string
          nullable: true
          example: Control anual

    Dueno:
      type: object
      required: [id_dueno, nombre, telefono]
      additionalProperties: false
      properties:
        id_dueno:
          type: integer
          example: 1
        nombre:
          type: string
          example: Juan Pérez
        telefono:
          type: string
          example: '+56912345678'
        email:
          type: string
          format: email
          nullable: true
          example: juan@mail.cl

    BloqueHorario:
      type: object
      required:
        [id, id_veterinario, nombre_veterinario, especialidad,
         fecha, hora_inicio, hora_fin, cupos_libres]
      additionalProperties: false
      properties:
        id:
          type: integer
          description: Es el id_bloque que usa una reserva
          example: 1
        id_veterinario:
          type: integer
          example: 1
        nombre_veterinario:
          type: string
          example: Dra. Carmen Rojas
        especialidad:
          type: string
          example: Medicina general
        fecha:
          type: string
          description: Formato AAAA-MM-DD
          example: '2026-11-23'
        hora_inicio:
          type: string
          description: Formato HH:MM
          example: '09:00'
        hora_fin:
          type: string
          description: Formato HH:MM
          example: '09:30'
        cupos_libres:
          type: integer
          minimum: 0
          example: 3

    Reserva:
      type: object
      required:
        [id_reserva, id_dueno, id_bloque, nombre_veterinario, fecha,
         hora_inicio, mascota_nombre, estado, creada_en]
      additionalProperties: false
      properties:
        id_reserva:
          type: integer
          example: 1
        id_dueno:
          type: integer
          example: 1
        id_bloque:
          type: integer
          description: Bloque reservado en Agenda
          example: 1
        nombre_veterinario:
          type: string
          example: Dra. Carmen Rojas
        fecha:
          type: string
          description: Copia de la fecha que devolvio Agenda (AAAA-MM-DD)
          example: '2026-11-23'
        hora_inicio:
          type: string
          description: Copia de la hora de inicio que devolvio Agenda (HH:MM)
          example: '09:00'
        mascota_nombre:
          type: string
          example: Rex
        motivo:
          type: string
          nullable: true
          example: Control anual
        estado:
          type: string
          enum: [activa, cancelada]
          example: activa
        creada_en:
          type: string
          description: Fecha y hora de creacion (AAAA-MM-DD HH:MM:SS)
          example: '2026-10-26 11:30:00'
        _links:
          type: object
          description: Solo aparece en GET /v1/reservas/{id_reserva}
          required: [self, dueno]
          properties:
            self:
              type: string
              example: /v1/reservas/1
            dueno:
              type: string
              example: /v1/duenos/1
            cancelar:
              type: object
              description: Solo aparece si la reserva sigue activa
              required: [href, metodo]
              properties:
                href:
                  type: string
                  example: /v1/reservas/1
                metodo:
                  type: string
                  example: DELETE

    Salud:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: ok

    Error400:
      type: object
      required: [error, detalle]
      properties:
        error:
          type: string
          example: DATOS_INVALIDOS
        detalle:
          type: string
          example: 'Datos inválidos o mal formados. Revisa los campos: nombre, telefono'

    Error401:
      type: object
      required: [error, detalle]
      properties:
        error:
          type: string
          example: NO_AUTORIZADO
        detalle:
          type: string
          example: Falta el header X-API-Key

    Error403:
      type: object
      required: [error, detalle]
      properties:
        error:
          type: string
          example: PROHIBIDO
        detalle:
          type: string
          example: La API Key proporcionada solo tiene permisos de lectura

    Error404:
      type: object
      required: [error, detalle]
      properties:
        error:
          type: string
          example: NO_ENCONTRADO
        detalle:
          type: string
          example: Recurso no encontrado

    Error409:
      type: object
      required: [error, detalle]
      properties:
        error:
          type: string
          example: SIN_CUPO
        detalle:
          type: string
          example: El bloque ya no tiene cupos libres

    Error415:
      type: object
      required: [error, detalle]
      properties:
        error:
          type: string
          example: CONTENIDO_NO_SOPORTADO
        detalle:
          type: string
          example: 'El cuerpo de la peticion debe ser JSON (Content-Type: application/json).'

    Error422:
      type: object
      required: [error, detalle]
      properties:
        error:
          type: string
          example: REGLA_NEGOCIO
        detalle:
          type: string
          example: No se puede reservar en un bloque con fecha pasada

    Error503:
      type: object
      required: [error, detalle]
      properties:
        error:
          type: string
          example: AGENDA_NO_DISPONIBLE
        detalle:
          type: string
          example: El servicio de Agenda no esta disponible. Intenta de nuevo en un momento.

    Error504:
      type: object
      required: [error, detalle]
      properties:
        error:
          type: string
          example: AGENDA_TIMEOUT
        detalle:
          type: string
          example: El servicio de Agenda tardó demasiado en responder y la operación fue revertida por seguridad.