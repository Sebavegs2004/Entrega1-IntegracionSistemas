// ============================================================
// Contrato del servicio interno Agenda (gRPC)
// Fuente única de verdad: cualquier cambio se hace aquí y se
// regeneran los stubs de Python (Docker lo hace al construir).
//
// Reglas de evolución y compatibilidad (ADR-003):
// 1. Nunca reutilizar ni cambiar el número de etiqueta de un campo.
// 2. Si se elimina un campo en el futuro, declarar su número y nombre
//    con 'reserved' para evitar colisiones en clientes antiguos.
// 3. Campos nuevos deben ser opcionales (valores por defecto en proto3).
// ============================================================
syntax = "proto3";

package agenda.v1;

service AgendaService {
  // Lista los bloques horarios disponibles, con filtros opcionales.
  rpc ListarBloques (ListarBloquesRequest) returns (ListarBloquesResponse);

  // Consulta un bloque específico con los datos de su veterinario y cupos libres.
  rpc ObtenerBloque (ObtenerBloqueRequest) returns (BloqueHorario);

  // Decrementa en 1 el cupo libre de un bloque (reservar).
  // Errores canónicos: NOT_FOUND (bloque no existe), FAILED_PRECONDITION (fecha pasada),
  // RESOURCE_EXHAUSTED (sin cupos).
  rpc ReservarCupo (ReservarCupoRequest) returns (ReservarCupoResponse);

  // Incrementa en 1 el cupo libre de un bloque (liberar al cancelar).
  rpc LiberarCupo (LiberarCupoRequest) returns (LiberarCupoResponse);
}

message ListarBloquesRequest {
  int32 id_veterinario = 1;   // 0 = todos
  string fecha = 2;           // "YYYY-MM-DD" o "" = todas
}

message ObtenerBloqueRequest {
  int32 id_bloque = 1;
}

message BloqueHorario {
  int32 id = 1;
  int32 id_veterinario = 2;
  string nombre_veterinario = 3;
  string especialidad = 4;
  string fecha = 5;           // "YYYY-MM-DD"
  string hora_inicio = 6;     // "HH:MM"
  string hora_fin = 7;        // "HH:MM"
  int32 cupos_libres = 8;
}

message ListarBloquesResponse {
  repeated BloqueHorario bloques = 1;
}

message ReservarCupoRequest {
  int32 id_bloque = 1;
}

message ReservarCupoResponse {
  bool exito = 1;
  string mensaje = 2;
  BloqueHorario bloque = 3;   // datos del bloque; se envía si hubo éxito
}

message LiberarCupoRequest {
  int32 id_bloque = 1;
  int32 id_reserva = 2;   // id de la reserva que libera el cupo (idempotencia)
}

message LiberarCupoResponse {
  bool exito = 1;
  string mensaje = 2;
  bool ya_liberado = 3;   // true si el id_reserva ya se había liberado antes
}